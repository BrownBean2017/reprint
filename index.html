<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUDAS - Lead Artist Applicant</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD Globals) - React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser TSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e5e5e5;
      }
      h1, h2, h3, .serif-font {
        font-family: 'Cinzel', serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f0f;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #eab308; /* Amber-500 */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Application Logic Embedded Directly -->
    <script type="text/babel" data-presets="react,typescript">
      // Access global React variables provided by the UMD scripts in <head>
      const { useState, useEffect } = React;

      /* 
        =============================================================================
        🎨 PORTFOLIO CONFIGURATION
        =============================================================================
      */

      const PORTFOLIO_DATA = {
        title: "JUDAS",
        subtitle: "LEAD ARTIST APPLICANT",
        email: "cabertevon@gmail.com",
        description: "I am a re-print of the Ghost Story Game's Lead Artist, ready to be instantiated into the Judas mission. Understand the visual code that brings the Narrative Lego system to life!",
        images: [
          {
            id: 'img-1',
            // Updated to 2800x2345 aspect ratio as requested
            url: 'images/1a.jpg',
            alt: 'Main Hallway Concept',
          },
          {
            id: 'img-2',
            url: 'images/2a.jpg',
            alt: 'Character Detail',
          },
          {
            id: 'img-3',
            url: 'images/2b.jpg',
            alt: 'Machinery Room',
          },
          {
            id: 'img-4',
            url: 'images/3a.jpg',
            alt: 'Atmospheric Lighting Study',
          },
          {
            id: 'img-5',
            url: 'images/2a.jpg',
            alt: 'Weapon Prop Design',
          },
          {
            id: 'img-6',
            url: 'images/3a.jpg',
            alt: 'Vertical Slice Level Layout',
          },
        ],
      };

      // --- ICONS ---

      const ArtStationIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
          <path d="M9.206 7.603L10.875 10.5h9.11l-1.652-2.897H9.206zM3.483 17.525l1.64 2.868h13.68l-1.66-2.868H3.483zm5.004-1.428l-4.502-7.89 1.665-2.895 4.5 7.89-1.663 2.895z" />
        </svg>
      );

      const MobyGamesIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4h20v16H2V4zm2 2v12h16V6H4zm3 2h2v6H7V8zm4 0h2v6h-2V8zm4 0h2v6h-2V8zm4 0h2v6h-2V8z" />
          <text x="50%" y="80%" dominantBaseline="middle" textAnchor="middle" fontSize="10" fontWeight="bold" fill="currentColor" style={{pointerEvents: 'none'}}>M</text>
        </svg>
      );

      const IMDbIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
          <path d="M20 3H4a1 1 0 00-1 1v16a1 1 0 001 1h16a1 1 0 001-1V4a1 1 0 00-1-1zM9.5 17h-2v-2h-1v2h-2V7h2v2h1V7h2v10zm4 0h-2V7h2v10zm4 0h-2.2l-1.6-4h-.2v4h-2V7h2.2l1.6 4h.2V7h2v10z" />
        </svg>
      );

      const ChevronDownIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="6 9 12 15 18 9" />
        </svg>
      );

      const SOCIAL_LINKS = [
        {
          name: 'Artstation',
          url: 'https://www.artstation.com/cabertevon',
        imagePath: "images/artstation.png", 
        },
        {
          name: 'MobyGames',
          url: 'https://www.mobygames.com/person/265846/von-caberte/',
          imagePath: 'images/moby.png',
        },
        {
          name: 'IMDb',
          url: 'https://www.imdb.com/name/nm10766677/',
          imagePath: 'images/imdb.png',
        },
      ];

      /* 
        =============================================================================
        ⚛️ APPLICATION LOGIC
        =============================================================================
      */

      const App = () => {
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 50);
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
          <div className="min-h-screen bg-[#050505] text-[#d4d4d4] selection:bg-amber-500 selection:text-black">
            
            {/* Navigation / Top Bar */}
            <nav 
              className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${
                scrolled ? 'bg-[#050505]/90 backdrop-blur-md border-b border-zinc-800' : 'bg-transparent'
              }`}
            >
              <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 bg-amber-600 rounded-full flex items-center justify-center text-black font-bold font-serif">
                    VC
                  </div>
                  <span className="font-bold text-lg tracking-widest text-zinc-100">
                    VON <span className="text-amber-600">CABERTE</span>
                  </span>
                </div>
                <a 
                  href={`mailto:${PORTFOLIO_DATA.email}`}
                  className="hidden sm:block px-6 py-2 border border-amber-600/50 text-amber-500 hover:bg-amber-600 hover:text-black transition-colors duration-300 uppercase text-xs tracking-widest font-bold rounded-sm"
                >
                  Email Me
                </a>
              </div>
            </nav>

            {/* Main Content Wrapper */}
            <main className="pt-20 pb-20">
              
              {/* Project Header */}
              <header className="max-w-4xl mx-auto text-center px-4 py-16 sm:py-24">
                <div className="mb-4 flex justify-center">
                  <div className="h-1 w-24 bg-gradient-to-r from-transparent via-amber-600 to-transparent"></div>
                </div>
                <h1 className="text-4xl sm:text-6xl md:text-7xl font-bold mb-4 tracking-tighter text-white drop-shadow-[0_0_10px_rgba(234,179,8,0.3)]">
                  {PORTFOLIO_DATA.title}
                </h1>
                <h2 className="text-lg sm:text-xl md:text-2xl text-amber-500 font-serif tracking-widest uppercase mb-8">
                  {PORTFOLIO_DATA.subtitle}
                </h2>
                <p className="max-w-2xl mx-auto text-zinc-400 text-sm sm:text-base leading-relaxed mb-12 border-l-2 border-amber-600/30 pl-6 text-left italic">
                  {PORTFOLIO_DATA.description}
                </p>
                
                <div className="flex justify-center animate-bounce text-zinc-500">
                   <ChevronDownIcon className="w-6 h-6" />
                </div>
              </header>

              {/* Continuous Image Stack (Behance Style) */}
              <section className="w-full bg-[#0a0a0c] border-y border-zinc-900 shadow-2xl">
                {/* 
                  Container Updates:
                  - flex/justify-center: Centers the stack horizontally.
                  - px-4 sm:px-8 md:px-12: Adds margins on the left/right on all screen sizes.
                  - py-10: Adds vertical spacing around the stack.
                */}
                <div className="w-full flex justify-center px-4 sm:px-8 md:px-12 py-10">
                  <div className="max-w-[1400px] w-full bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.8)]">
                    {PORTFOLIO_DATA.images.map((image, index) => (
                      <div key={image.id} className="relative block">
                        {/* Image Container */}
                        <div className="relative overflow-hidden w-full">
                          <img
                            src={image.url}
                            alt={image.alt}
                            loading={index < 2 ? "eager" : "lazy"}
                            className="w-full h-auto block object-cover"
                            style={{ 
                              display: 'block', // Crucial for removing bottom gap
                              filter: 'contrast(1.1) saturate(0.9)'
                            }} 
                          />
                          
                          {/* Decorative Scanlines (Subtle) */}
                          <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-[0.03] pointer-events-none"></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

            </main>

            {/* Footer */}
            <footer id="contact" className="bg-[#020202] border-t border-zinc-900 py-16">
              <div className="max-w-4xl mx-auto px-6 text-center">
                
                <p className="text-zinc-500 text-sm mb-8">+ + +</p>

                <div className="flex justify-center gap-8 mb-12">
                  {SOCIAL_LINKS.map((link) => (
                    <a
                      key={link.name}
                      href={link.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="group flex flex-col items-center gap-2 transition-transform hover:-translate-y-1"
                      aria-label={link.name}
                    >
                      <div className="w-14 h-14 bg-zinc-900 rounded-full flex items-center justify-center border border-zinc-800 group-hover:border-amber-500 group-hover:bg-amber-950/20 group-hover:shadow-[0_0_15px_rgba(234,179,8,0.3)] transition-all duration-300">
                        <img
                          src={link.imagePath} 
                          alt={link.name}
                          className="w-full h-full object-contain opacity-60 group-hover:opacity-100 transition-opacity duration-300 scale-[0.5]"/>
                       
                      </div>
                      <span className="text-xs text-zinc-600 font-bold uppercase tracking-widest group-hover:text-amber-500/80 transition-colors">
                        {link.name}
                      </span>
                    </a>
                  ))}
                </div>

                <div className="text-xs text-zinc-700 font-mono">
                  <p>&copy; {new Date().getFullYear()} Von Caberte. All rights reserved.</p>
                  <p className="mt-2">Designed with the <span className="text-amber-700">Judas</span> aesthetic.</p>
                </div>
              </div>
            </footer>
          </div>
        );
      };

      // --- INIT ---

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
